<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер карточных игр</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#333333">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Карты">
</head>
<body>
  <header class="app-header">
    <h1>Трекер карточных игр</h1>
  </header>

  <main class="app-main">
    <pre id="screen"></pre>
  </main>

  <footer class="app-footer">
    <input
      type="text"
      id="cmd"
      autocomplete="off"
      spellcheck="false"
      placeholder="Введите команду..."
    >
    <div class="help-panels">
      <section class="help-panel">
        <h2>Команды</h2>
        <pre id="commands-help"></pre>
      </section>
      <section class="help-panel">
        <h2>Правила</h2>
        <pre id="rules-help"></pre>
      </section>
    </div>
  </footer>

  <!-- Сначала модули игр, затем ядро -->
  <script src="js/rules/rules-plain.js"></script>
  <script src="js/rules/rules-seasalt.js"></script>
  <script src="js/rules/rules-sevenred.js"></script>
  <script src="js/rules/rules-joker.js"></script>
  <script src="js/rules/rules-thousand.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
